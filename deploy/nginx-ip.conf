limit_req_zone $binary_remote_addr zone=site_per_ip:10m rate=20r/s;

upstream threeve4_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 384k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /admin/ {
        return 403;
    }

    location ^~ /api/admin/ {
        return 403;
    }

    # Do not accept client contact details or traffic samples over plain HTTP.
    location = /api/leads/sample-audit {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 426 '{"error":"Sample submissions are paused until HTTPS is enabled."}';
    }

    location /_next/static/ {
        proxy_pass http://threeve4_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        limit_req zone=site_per_ip burst=40 nodelay;
        proxy_pass http://threeve4_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
