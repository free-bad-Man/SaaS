services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.vps
    image: 3ve4-site:local
    container_name: 3ve4-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    mem_limit: 700m
    cpus: 0.80
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
